name: Deploy
# Staging deploys automatically after Qualification passes on main.
# Production deploys only by manual dispatch of a SHA that is already live on
# staging, with a typed confirmation and a service-hours guard (OPS-1/OPS-13).
# Migrations, runtime grants and a retention pass run in the job, as
# gm_migrator, before any Railway change; no Railway service holds that
# credential.
on:
  workflow_run:
    workflows: [Qualification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main that is live on staging
        required: true
        type: string
      confirm:
        description: "Type exactly: deploy <first 7 characters of sha> to production"
        required: true
        type: string
      allow_service_hours:
        description: Allow 12:00-23:59 America/Mexico_City (restaurant service hours)
        type: boolean
        default: false
      railway_config:
        description: >-
          Railway IaC sync. auto = apply only when the SHA is the head of main
          (a rollback keeps the current configuration); apply = always; skip = never
        type: choice
        options: [auto, apply, skip]
        default: auto
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false
jobs:
  staging:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          sha: ${{ env.SHA }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          railway-cli-version: ${{ vars.RAILWAY_CLI_VERSION }}
          railway-iac-version: ${{ vars.RAILWAY_IAC_VERSION }}
          app-url: ${{ vars.APP_URL }}
          migration-database-url: ${{ secrets.MIGRATION_DATABASE_URL }}
          pg-app-user: ${{ vars.PG_APP_USER }}
          app-env: staging
          alert-webhook-url: ${{ secrets.ALERT_WEBHOOK_URL }}
          alert-webhook-kind: ${{ vars.ALERT_WEBHOOK_KIND || 'ntfy' }}
      - name: Record staging proof for production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=deploy/staging \
            -f description="Live and smoke-tested on staging" >/dev/null

  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      statuses: read
      actions: read
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          ALLOW_SERVICE_HOURS: ${{ inputs.allow_service_hours }}
          RAILWAY_CONFIG: ${{ inputs.railway_config }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lowercase commit"; exit 1; }
          [ "$CONFIRM" = "deploy ${SHA:0:7} to production" ] || { echo "confirmation phrase mismatch"; exit 1; }
          probe="$RUNNER_TEMP/guard" && mkdir -p "$probe" && cd "$probe"
          git init -q && git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          # GitHub's git endpoint takes the job token as basic auth (x-access-token),
          # as actions/checkout sends it; a bearer header makes git prompt for a
          # username and fail on a private repository (first production dispatch).
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "sha is not on main"; exit 1; }
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
            --jq '[.[] | select(.context == "deploy/staging")][0].state')
          [ "$state" = "success" ] || { echo "sha was never live on staging"; exit 1; }
          # A successful workflow can contain skipped jobs. Require both actual
          # restaurant-day jobs on this exact SHA, not a green PR ancestor.
          # >>> restaurant-day-production-guard
          # Scheduled runs can check out a configured branch instead of their event
          # SHA. Only manual runs prove the actual dispatch ref was tested.
          day_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/restaurant-day.yml/runs?event=workflow_dispatch&head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .id // empty')
          [ -n "$day_run" ] || { echo "restaurant-day evidence missing for this sha"; exit 1; }
          day_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$day_run/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')
          for required in restaurant-day restaurant-day-payments; do
            printf '%s\n' "$day_jobs" | awk -F '\t' -v name="$required" \
              '$1 == name && $2 == "success" { found=1 } END { exit !found }' \
              || { echo "$required must have passed on this sha (skipped is not passed)"; exit 1; }
          done
          # <<< restaurant-day-production-guard
          # Mexico City has no DST since 2022 (UTC-6 year-round).
          hour=$(TZ=America/Mexico_City date +%H)
          if [ "$hour" -ge 12 ] && [ "$ALLOW_SERVICE_HOURS" != "true" ]; then
            echo "refused during service hours (12:00-23:59 America/Mexico_City)"; exit 1
          fi
          # A rollback (any SHA behind main's head) keeps the live Railway
          # configuration: an older railway.ts omits newer variables, which
          # Railway would plan as deletions and apply --yes refuses (OPS-R4).
          # >>> iac-sync-decision (executed by tests/workflows.test.ts)
          head=$(git rev-parse origin/main)
          case "${RAILWAY_CONFIG:-auto}" in
            auto) if [ "$SHA" = "$head" ]; then sync=true; else sync=false; fi ;;
            apply) sync=true ;;
            skip) sync=false ;;
            *) echo "railway_config must be auto, apply or skip"; exit 1 ;;
          esac
          echo "Railway IaC sync: $sync (sha is main head: $([ "$SHA" = "$head" ] && echo yes || echo no))"
          echo "sync_config=$sync" >> "$GITHUB_OUTPUT"
          # <<< iac-sync-decision
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          # The job's write token never sits in .git/config for npm, the build or
          # the Railway CLI to read (PLATFORM-CI-5).
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          sha: ${{ env.SHA }}
          sync-config: ${{ steps.guard.outputs.sync_config }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          railway-cli-version: ${{ vars.RAILWAY_CLI_VERSION }}
          railway-iac-version: ${{ vars.RAILWAY_IAC_VERSION }}
          app-url: ${{ vars.APP_URL }}
          migration-database-url: ${{ secrets.MIGRATION_DATABASE_URL }}
          pg-app-user: ${{ vars.PG_APP_USER }}
          app-env: production
          alert-webhook-url: ${{ secrets.ALERT_WEBHOOK_URL }}
          alert-webhook-kind: ${{ vars.ALERT_WEBHOOK_KIND || 'ntfy' }}
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest prod-* tag is the live release: retention.yml runs its code.
          # gh release create makes the tag at $SHA (no local git credentials needed).
          tag="prod-$(date -u +%Y%m%d-%H%M)-${SHA:0:7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --generate-notes --title "$tag"
